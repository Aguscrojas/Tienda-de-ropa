<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closet de Jenn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">CLOSET<span>JENN</span></div>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#productos">Colección</a></li>
                <li><a href="#">Carrito (<span id="cart-count">0</span>)</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>Nueva Colección 2026</h1>
            <p>Esencia minimalista para el día a día.</p>
            <a href="#productos" class="btn">Comprar ahora</a>
        </div>
    </section>

    <main id="productos" class="container">
        <h2 class="section-title">Producto destacado</h2>
        <div class="product-grid">
            
        
            <div class="product-card">
                <img src="https://tworldstore.cl/4691-superlarge_default/camisa-oxford-light-ml-hombre.jpg" alt="Camisa blanca">
                <h3>Camisa Essential</h3>
                <p class="price">$8.000</p>
                <button class="add-cart">Añadir al carro</button>
            </div>
            
            <div class="product-card">
                <img src="https://tworldstore.cl/6178-superlarge_default/jeans-free-action-line-hombre.jpg" alt="Jeans">
                <h3>Jeans Slim Fit</h3>
                <p class="price">$12.000</p>
                <button class="add-cart">Añadir al carro</button>
            </div>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 Closet de Jenn - Todos los derechos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
